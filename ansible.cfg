[defaults]
nocows = true
roles_path = ./roles
# The cluster tokens are in the inventory's *.sops.yml files. Without this
# plugin they would be undefined, and the k3s roles would drop them.
vars_plugins_enabled = host_group_vars,community.sops.sops
# No default inventory: always pass -i ~/DEV/ansible-inventory/inventory.yml

remote_tmp = $HOME/.ansible/tmp
local_tmp  = $HOME/.ansible/tmp
pipelining = True
become = True
host_key_checking = False
deprecation_warnings = False
callback_whitelist = profile_tasks
interpreter_python=auto_silent
