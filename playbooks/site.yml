---
- name: Cluster prep
  hosts: "{{ cluster_group | default('k3s_cluster') }}"
  gather_facts: true
  become: true
  roles:
    - role: prereq
    - role: airgap
    - role: raspberrypi

- name: Setup K3S server
  hosts: "{{ server_group | default('server') }}"
  gather_facts: false
  become: true
  serial: "{{ k3s_server_serial | default('100%') }}"
  roles:
    - role: k3s_server

- name: Setup K3S agent
  hosts: "{{ agent_group | default('agent') }}"
  gather_facts: false
  become: true
  roles:
    - role: k3s_agent
